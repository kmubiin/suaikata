# maklumat meta bagi penyumbang projek
# aturan:
# . salin rangka data bahagian paling atas dalam senarai,
# . dan tampal pada bahagian paling bawah dalam senarai,
#   pada baris kedua sebelum terakhir, sebelum tiga noktah
# . jika komen tidak diperlukan, buang bahagian baris yang
#   bermula dengan ' # salinan...'
# . isi nilai baharu bagi setiap ruang berkenaan
# petunjuk:
# . OBJEK data ini: site.data.penyumbang
# . bilangan penyumbang = {{ OBJEK.size - 1 }}
# nota 1:
# . 'id' adalah nama pengguna, atau nama yang dapat dirujuk
#   secara langsung pada penyumbang itu;
# . nilai 'id' akan disalin ke senarai penyumbang dalam
#   data daftar, jika berkenaan
# nota 2:
# . 'pena' adalah nama pengguna yang unik, berhuruf BESAR,
#   yang disebut dalam mana-mana daftar, jika ada
# . jika nilai 'pena' hadir, maka anggap penyumbang itu
#   ialah ahli projek dan pernah menyumbang daftar rasmi
# nota 3:
# . 'mengapa' adalah senarai sumbangan yang dikenal pasti
#   bagi penyumbang itu;
# . setiap sumbangan ditulis dalam satu baris sahaja;
# . sebaiknya tidak melebihi 60 aksara dalam satu baris
#   (termasuk tarikh, tanda bina, atau #isu dalam kurungan)
---
-  # salinan rangka data baharu
  id:
  pena:
  mengapa:
    - 
