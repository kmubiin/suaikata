# maklumat meta bagi sejarah dan usul projek
# aturan:
# . salin rangka data bahagian paling atas dalam senarai,
# . dan tampal pada bahagian paling bawah dalam senarai,
#   pada baris kedua sebelum terakhir, sebelum tiga noktah
# . jika komen tidak diperlukan, buang bahagian baris yang
#   bermula dengan ' # salinan...'
# . isi nilai baharu bagi setiap ruang berkenaan
# petunjuk:
# . OBJEK data ini: site.data.sejarah
# . bilangan sejarah = {{ OBJEK.size - 1}}
# nota 1:
# . 'bila' adalah tarikh terawal sejarah dalam format ISO
#    tahun-bulan-hari (YYYY-MM-DD);
# . nilai 'bila' boleh disalin semula untuk menyimpan
#   beberapa sejarah yang lain pada tarikh yang sama
# nota 2:
# . 'apa' adalah sebaris tajuk yang dapat menerangkan
#   sejarah yang berlaku pada tarikh tersebut;
# . nilai 'apa' boleh diakhiri dengan nota (bertanda)
#   bagi #isu, atau 7-aksara unik dan @terbitan, jika ada
# nota 3:
# . 'mana' adalah alamat relatif di laman sumber;
# . nilai 'mana' boleh digunakan untuk menyatakan ada
#   catatan berkaitan sejarah itu, atau ada data berkenaan
#   yang boleh dirujuk semula
